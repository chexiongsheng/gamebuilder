  - id: 4ec7b47a21f0474d958d7dd628d4d292
    label: SpawnActorActionCard.js.txt
    javascript: |-
      
      export const PROPS = [
        propActor('ActorToClone', '', {
          label: "Actor to Clone",
          pickerPrompt: "Clone what actor?",
          allowOffstageActors: true
        }),
        propNumber('XOffset', 0),
        propNumber('YOffset', 1),
        propNumber('ZOffset', 0),
        propNumber('MaxClones', 5),
      ];
      
      /**
       * @param {GActionMessage} actionMessage
       */
      export function onAction(actionMessage) {
        if (!exists(props.ActorToClone)) {
          return;
        }
        let count = 0;
        getActors().forEach(actor => count += getCloneParent(actor) === props.ActorToClone ? 1 : 0);
        if (count >= props.MaxClones) {
          return;
        }
        const offset = vec3(props.XOffset, props.YOffset, props.ZOffset);
        const p = getPos();
        p.add(offset);
        card.myClone = clone(props.ActorToClone, p, getRot());
      }
      
      export function getCardErrorMessage() {
        if (!exists(props.ActorToClone)) {
          return "NEED ACTOR TO CLONE. Click card to fix.";
        }
      }
      
      export function onTick() {
        if(!exists(card.myClone)) {
          const offset = vec3(props.XOffset, props.YOffset, props.ZOffset);
          const p = getPos();
          p.add(offset);
          card.myClone = clone(props.ActorToClone, p, getRot());
        }
      }
    draftJavascript: ""
    userLibraryFile: ""
    metadataJson: |
      {
        "cardSystemCardData" : {
          "isCard": true,
          "title": "Spawn Actor",
          "description": "Spawn a clone of another actor.",
          "categories" : ["TargetedAction", "Action", "UntargetedAction"],
          "imageResourcePath": "BuiltinAssets/CardImages/spawn"
        }
      }
