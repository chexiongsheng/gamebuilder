  - id: 1d3e40c7f447404fb8e65f687e17bc19
    label: Custom
    javascript: |
      // Example card.
      
      export function onInit() {
        card.tests = {};
      }
      
      export function onRegisterTest(args) {
        const name = args.name;
        if (name in card.tests) {
          throw new Error(`Duplicate test name registered: ${name}`);
        }
        else {
          card.tests[name] = { state: 'running', timeoutSeconds: args.timeoutSeconds || 3 };
        }
      }
      
      export function onTick() {
        const t1 = getTimeSinceReset();
        for (var testName in card.tests) {
          const test = card.tests[testName];
          const to = test.timeoutSeconds;
          if (test.state == 'running' && to < t1) {
            test.state = 'failed';
            test.error = `Test '${testName}' timed out! Took over ${to} seconds.'`;
          }
        }
        //  log(`time: ${getTimeSinceReset()}`);
      }
      
      export function onTestFailed(args) {
        const test = card.tests[args.name];
        test.state = 'failed';
        test.error = args.error;
      }
      
      export function onTestPassed(testName) {
        const test = card.tests[testName];
        if(test === undefined) {
          throw new Error(`Unknown test name: ${testName}`);
        }
        if (test.state == 'running') {
          test.state = 'passed';
        }
      }
      
      // onTick is called every frame (50-60 times per second).
      export function onLocalTick() {
        const LINEHT = 25;
        const MARGIN = 5;
        const NUM_LINES = 1 + Object.keys(card.tests).length + 1;
        const HEIGHT = NUM_LINES * LINEHT + MARGIN * 2;
      
        const WIDTH = 800;
        const x = 0;
      
        let y = 900 / 2 - HEIGHT / 2;
        uiRect(x, y, WIDTH, HEIGHT, UiColor.BLACK, { opacity: 0.95 });
        let dy = LINEHT;
        y += MARGIN;
        uiText(x + MARGIN, y, "Tests:", UiColor.WHITE);
        y += dy;
      
        const t1 = getTimeSinceReset();
      
        for (var testName in card.tests) {
          const test = card.tests[testName];
          const status = test.state;
          let c = status == 'running' ? UiColor.YELLOW :
            status == 'passed' ? UiColor.GREEN :
              UiColor.RED;
          const timeLeft = test.timeoutSeconds - t1;
          const text = 
          status == 'running' ? `${testName} (${timeLeft.toFixed(1)}s)`
          : `${testName} ${test.error||''}`;
          uiText(x + MARGIN + 20, y, text, c, {textSize: 16});
          y += dy;
        }
      
        let total = 0;
        let numPassed = 0;
        let numFailed = 0;
        for (var testName in card.tests) {
          const status = card.tests[testName].state;
          total++;
          if (status == 'passed') numPassed++;
          if (status == 'failed') numFailed++;
        }
        if (numPassed == total) {
          uiText(x + MARGIN, y, `Yay! All ${total} tests passed :)`, UiColor.GREEN);
        }
        else if (numFailed > 0) {
          uiText(x + MARGIN, y, `Uh oh! ${numFailed} failed.`, UiColor.RED);
        }
        else {
          uiText(x + MARGIN, y, `Waiting on ${total - numPassed}..`, UiColor.YELLOW);
        }
      }
