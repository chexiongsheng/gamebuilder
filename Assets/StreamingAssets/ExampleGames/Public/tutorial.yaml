  - id: e9ff7dcb422f40aaaecafb2a7b2caa8d
    label: Custom
    javascript: |
      import { uiGetTextHeight, uiGetTextWidth, uiRect, uiText } from '../../apiv2/ui/widgets.mjs';
      import { getCard } from '../../apiv2/actors/memory.mjs';
      
      export function onResetTutorial() {
        getCard().doShow = false;
        resetGame();
      }
      
      export function onShowTest() {
        getCard().doShow = true;
      }
      
      export function onGameEnd() {
        getCard().doShow = true;
      }
      
      export function onTick() {
        if (!getCard().doShow) return;
      
        const msg = `Tutorial complete - congrats!
      
      `
          + `To learn more, check out the sample games in the Game Library.
      
      `
          + `Use BUILD MODE to see how they work! Modify them to make your own!`;
        const m = 50;
        const h = uiGetTextHeight(msg) + m;
        const w = uiGetTextWidth(msg) + m;
        uiRect(800-w/2, 200-h/2, w, h, 0x1a4d0d, {opacity: 0.98});
        uiText(800, 200, msg, UiColor.WHITE, { center: true });
      }
    draftJavascript: ""
    userLibraryFile: ""
    metadataJson: "{\"cardSystemCardData\":{\"isCard\":true,\"title\":\"Final message\",\"description\":\"Describe what your card does here!\",\"categories\":[\"Custom\"],\"imageResourcePath\":\"\",\"listPriority\":0,\"hidden\":false,\"userProvidedId\":\"\"}}"
  - id: 4ec7b47a21f0474d958d7dd628d4d292
    label: SpawnActorActionCard.js.txt
    javascript: |+
      import { getProps, propActor, propNumber } from '../../apiv2/actors/properties.mjs';
      import { exists, getActors } from '../../apiv2/actors/actors.mjs';
      import { vec3 } from '../../apiv2/misc/math.mjs';
      import { getPos } from '../../apiv2/transform/position-get.mjs';
      import { getCard } from '../../apiv2/actors/memory.mjs';
      import { getRot } from '../../apiv2/transform/rotation-get.mjs';
      import { getCloneParent, clone } from '../../apiv2/actors/cloning.mjs';
      
      export const PROPS = [
        propActor('ActorToClone', '', {
          label: 'Actor to Clone',
          pickerPrompt: 'Clone what actor?',
          allowOffstageActors: true
        }),
        propNumber('XOffset', 0),
        propNumber('YOffset', 1),
        propNumber('ZOffset', 0),
        propNumber('MaxClones', 5),
      ];
      
      /**
       * @param {GActionMessage} actionMessage
       */
      export function onAction(actionMessage) {
        if (!exists(getProps().ActorToClone)) {
          return;
        }
        let count = 0;
        getActors().forEach(actor => count += getCloneParent(actor) === getProps().ActorToClone ? 1 : 0);
        if (count >= getProps().MaxClones) {
          return;
        }
        const offset = vec3(getProps().XOffset, getProps().YOffset, getProps().ZOffset);
        const p = getPos();
        p.add(offset);
        getCard().myClone = clone(getProps().ActorToClone, p, getRot());
      }
      
      export function getCardErrorMessage() {
        if (!exists(getProps().ActorToClone)) {
          return 'NEED ACTOR TO CLONE. Click card to fix.';
        }
      }
      
      export function onTick() {
        if(!exists(getCard().myClone)) {
          const offset = vec3(getProps().XOffset, getProps().YOffset, getProps().ZOffset);
          const p = getPos();
          p.add(offset);
          getCard().myClone = clone(getProps().ActorToClone, p, getRot());
        }
      }
      
